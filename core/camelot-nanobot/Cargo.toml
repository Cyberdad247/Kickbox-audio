[package]
name = "camelot-nanobot"
version = "0.1.0"
edition = "2021"
description = "Native Rust/WASM Bio-Kinetic Nanobot Swarm Engine with Merlin Loop-Prompting DAG & Autonomous Self-Triaging"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
sha2 = "0.10"
hex = "0.4"

[lib]
name = "camelot_nanobot"
path = "src/lib.rs"

[[bin]]
name = "camelot-nanobot"
path = "src/main.rs"
