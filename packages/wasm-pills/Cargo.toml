[package]
name = "aaliyah_comms"
version = "0.1.0"
edition = "2021"
description = "Aaliyah CMS Agency — WASM MCP pill for sovereign email campaign management"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package.metadata.wasm-pack]
wasm-opt = false
